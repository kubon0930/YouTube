<title>やま幸 YAMAYUKI — YouTube イントロ</title>
<style>
  :root {
    --ink:#05070e; --ink2:#0c1322; --deep:#17263f;
    --gold:#c9a25a; --gold-hi:#f7e6b4; --gold-deep:#9c7635;
    --aka:#c31f2d; --aka-hi:#ff4d4d; --paper:#f4eede;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body {
    width:100%; height:100%; min-height:100vh; background:#000; overflow:hidden;
    font-family:"Yu Mincho","YuMincho","Hiragino Mincho ProN","Noto Serif JP","Shippori Mincho",serif;
  }
  #stage {
    position:fixed; inset:0; margin:auto;
    aspect-ratio:16/9; max-width:100vw; max-height:100vh; width:100%;
    background:radial-gradient(130% 100% at 50% 8%, var(--deep) 0%, var(--ink2) 40%, var(--ink) 100%);
    overflow:hidden; color:var(--paper); isolation:isolate;
  }
  #fx { position:absolute; inset:0; width:100%; height:100%; z-index:0; }
  .caustic { position:absolute; border-radius:50%; filter:blur(40px); mix-blend-mode:screen; opacity:0; z-index:1; }
  .caustic.a { top:-18%; left:12%; width:55vh; height:55vh;
    background:radial-gradient(circle, rgba(201,162,90,.22), transparent 68%);
    animation:drift1 14s ease-in-out infinite, glowIn 3s ease-out forwards .2s; }
  .caustic.b { bottom:-22%; right:8%; width:62vh; height:62vh;
    background:radial-gradient(circle, rgba(23,38,63,.55), rgba(201,162,90,.10), transparent 70%);
    animation:drift2 18s ease-in-out infinite, glowIn 3s ease-out forwards .5s; }
  @keyframes glowIn { to { opacity:1; } }
  @keyframes drift1 { 0%,100%{transform:translate(0,0)} 50%{transform:translate(6%,4%)} }
  @keyframes drift2 { 0%,100%{transform:translate(0,0)} 50%{transform:translate(-5%,-4%)} }

  .frame { position:absolute; z-index:3; background:linear-gradient(var(--gold),var(--gold-hi)); opacity:.85; }
  .frame.t { top:7.5%; left:9%; right:9%; height:1px; transform:scaleX(0); transform-origin:left;
    animation:drawX 1.1s cubic-bezier(.2,.7,.2,1) forwards .35s; }
  .frame.b { bottom:7.5%; left:9%; right:9%; height:1px; transform:scaleX(0); transform-origin:right;
    animation:drawX 1.1s cubic-bezier(.2,.7,.2,1) forwards .5s; }
  .frame.l { left:9%; top:7.5%; bottom:7.5%; width:1px; transform:scaleY(0); transform-origin:top;
    animation:drawY 1.1s cubic-bezier(.2,.7,.2,1) forwards .55s; }
  .frame.r { right:9%; top:7.5%; bottom:7.5%; width:1px; transform:scaleY(0); transform-origin:bottom;
    animation:drawY 1.1s cubic-bezier(.2,.7,.2,1) forwards .55s; }
  @keyframes drawX { to { transform:scaleX(1); } }
  @keyframes drawY { to { transform:scaleY(1); } }

  .center { position:absolute; inset:0; z-index:4; display:flex; flex-direction:column;
    align-items:center; justify-content:center; gap:2.4vh; text-align:center; }

  .eyebrow {
    font-family:"Optima","Palatino Linotype","Baskerville","Georgia",serif;
    font-size:1.9vh; letter-spacing:.62em; padding-left:.62em; font-weight:500;
    color:var(--gold-hi); opacity:0; animation:rise 1s ease-out forwards 1.5s;
  }
  .eyebrow::before, .eyebrow::after {
    content:""; display:inline-block; width:3.4vh; height:1px; vertical-align:middle;
    background:linear-gradient(90deg,transparent,var(--gold)); margin:0 1.4vh .4vh;
  }
  .eyebrow::after { background:linear-gradient(90deg,var(--gold),transparent); }

  .brand {
    font-weight:700; font-size:22vh; line-height:.98; letter-spacing:.03em;
    background:linear-gradient(100deg, var(--gold-deep) 0%, var(--gold) 26%, var(--gold-hi) 44%,
      #fffdf3 50%, var(--gold-hi) 56%, var(--gold) 74%, var(--gold-deep) 100%);
    background-size:250% 100%; background-position:210% 0;
    -webkit-background-clip:text; background-clip:text; color:transparent; -webkit-text-fill-color:transparent;
    clip-path:inset(0 100% 0 0); filter:drop-shadow(0 .6vh 3vh rgba(0,0,0,.55));
    animation: brandWipe 1.2s cubic-bezier(.22,.9,.24,1) forwards .8s,
               brandSheen 2.4s cubic-bezier(.4,0,.2,1) forwards 1.7s;
  }
  @keyframes brandWipe { to { clip-path:inset(0 0 0 0); } }
  @keyframes brandSheen { from { background-position:210% 0; } to { background-position:-40% 0; } }

  .seal {
    position:absolute; z-index:5; right:14.5%; top:26%;
    width:9vh; height:9vh; border:.55vh solid var(--aka); border-radius:14%;
    display:flex; align-items:center; justify-content:center;
    color:var(--aka-hi); font-size:3.3vh; line-height:1.02; font-weight:700; letter-spacing:-.02em;
    box-shadow:0 0 3.6vh rgba(195,31,45,.4), inset 0 0 1.6vh rgba(195,31,45,.25);
    opacity:0; transform:rotate(-7deg) scale(1.7);
    animation:stamp .5s cubic-bezier(.2,1.5,.3,1) forwards 2.15s;
  }
  .seal span { transform:scale(.92); }
  @keyframes stamp {
    0%{opacity:0; transform:rotate(-7deg) scale(1.75);}
    55%{opacity:1; transform:rotate(-7deg) scale(.9);}
    100%{opacity:.97; transform:rotate(-7deg) scale(1);}
  }

  .wordmark {
    display:flex; gap:.02em; margin-top:.6vh;
    font-family:"Optima","Palatino Linotype","Baskerville","Georgia",serif;
    font-weight:500; font-size:4.4vh; letter-spacing:.5em; padding-left:.5em; color:var(--paper);
  }
  .wordmark span { opacity:0; transform:translateY(1.4vh); filter:blur(4px);
    animation:letterIn .8s cubic-bezier(.16,.9,.24,1) forwards; }
  .wordmark span:nth-child(1){animation-delay:2.35s}
  .wordmark span:nth-child(2){animation-delay:2.42s}
  .wordmark span:nth-child(3){animation-delay:2.49s}
  .wordmark span:nth-child(4){animation-delay:2.56s}
  .wordmark span:nth-child(5){animation-delay:2.63s}
  .wordmark span:nth-child(6){animation-delay:2.70s}
  .wordmark span:nth-child(7){animation-delay:2.77s}
  .wordmark span:nth-child(8){animation-delay:2.84s}
  @keyframes letterIn { to { opacity:1; transform:translateY(0); filter:blur(0); } }

  .tagline {
    font-family:"Optima","Palatino Linotype","Baskerville","Georgia",serif;
    font-size:1.7vh; letter-spacing:.34em; padding-left:.34em; color:var(--gold);
    opacity:0; animation:rise 1s ease-out forwards 3.1s;
  }
  .tagline b { color:var(--aka-hi); font-weight:600; }
  @keyframes rise { from{opacity:0; transform:translateY(1.4vh)} to{opacity:1; transform:translateY(0)} }

  .progress {
    position:absolute; left:0; bottom:0; z-index:6; height:.5vh; width:0%;
    background:linear-gradient(90deg,var(--gold),var(--gold-hi),var(--aka));
    box-shadow:0 0 2vh rgba(201,162,90,.6);
    animation:fill 7.4s cubic-bezier(.4,0,.2,1) forwards .4s;
  }
  @keyframes fill { to { width:100%; } }

  #fadeout {
    position:absolute; inset:0; z-index:9; background:#000; opacity:0; pointer-events:none;
    animation:outro 1.1s ease-in forwards 7.6s;
  }
  @keyframes outro { to { opacity:1; } }

  #replay {
    position:fixed; right:18px; bottom:18px; z-index:20;
    padding:10px 18px; border:1px solid var(--gold); border-radius:999px;
    background:rgba(0,0,0,.45); color:var(--gold-hi);
    font-family:system-ui,sans-serif; font-size:13px; letter-spacing:.08em;
    cursor:pointer; opacity:.32; transition:opacity .2s;
  }
  #replay:hover { opacity:1; }

  @media (prefers-reduced-motion: reduce) {
    #stage *{ animation-duration:.01ms !important; animation-delay:0s !important; }
    .brand{ clip-path:inset(0 0 0 0); }
  }
</style>

<div id="stage">
  <canvas id="fx"></canvas>
  <div class="caustic a"></div>
  <div class="caustic b"></div>
  <div class="frame t"></div><div class="frame b"></div>
  <div class="frame l"></div><div class="frame r"></div>
  <div class="seal"><span>本<br>鮪</span></div>
  <div class="center">
    <div class="eyebrow">TOYOSU&nbsp;FISH&nbsp;MARKET</div>
    <div class="brand">やま幸</div>
    <div class="wordmark" aria-label="YAMAYUKI">
      <span>Y</span><span>A</span><span>M</span><span>A</span><span>Y</span><span>U</span><span>K</span><span>I</span>
    </div>
    <div class="tagline">BLUEFIN&nbsp;TUNA&nbsp;WHOLESALER&nbsp;&nbsp;<b>·</b>&nbsp;&nbsp;TOKYO</div>
  </div>
  <div class="progress"></div>
  <div id="fadeout"></div>
</div>
<button id="replay">▶ Replay</button>

<script>
  const stage = document.getElementById('stage');
  const cv = document.getElementById('fx');
  const ctx = cv.getContext('2d');
  let W, H, DPR, parts = [], raf;
  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = stage.clientWidth; H = stage.clientHeight;
    cv.width = W*DPR; cv.height = H*DPR;
    cv.style.width = W+'px'; cv.style.height = H+'px';
    ctx.setTransform(DPR,0,0,DPR,0,0);
  }
  function seed() {
    const n = Math.round((W*H)/26000) + 26;
    parts = Array.from({length:n}, () => ({
      x:Math.random()*W, y:Math.random()*H, r:Math.random()*1.6+0.4,
      vy:-(Math.random()*0.28+0.06), vx:(Math.random()-0.5)*0.18,
      a:Math.random()*Math.PI*2, tw:Math.random()*0.03+0.008
    }));
  }
  function draw() {
    ctx.clearRect(0,0,W,H);
    for (const p of parts) {
      p.y += p.vy; p.x += p.vx; p.a += p.tw;
      if (p.y < -6) { p.y = H+6; p.x = Math.random()*W; }
      if (p.x < -6) p.x = W+6; if (p.x > W+6) p.x = -6;
      const glow = 0.35 + 0.45*Math.sin(p.a);
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r, 0, Math.PI*2);
      ctx.fillStyle = 'rgba(247,230,180,' + (glow*0.9).toFixed(3) + ')';
      ctx.shadowColor = 'rgba(201,162,90,0.9)'; ctx.shadowBlur = 8;
      ctx.fill();
    }
    ctx.shadowBlur = 0;
    raf = requestAnimationFrame(draw);
  }
  function start(){ resize(); seed(); cancelAnimationFrame(raf); draw(); }
  start();
  window.addEventListener('resize', () => { resize(); seed(); });
  document.getElementById('replay').addEventListener('click', () => location.reload());
</script>
