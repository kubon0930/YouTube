<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>やま幸 YouTube イントロ</title>
<style>
  :root {
    --ink:      #0a0d14;   /* 墨（背景） */
    --ink2:     #121826;
    --gold:     #d9b871;   /* 金 */
    --gold-hi:  #f4e2b0;
    --aka:      #d1273a;   /* 鮪の赤・中トロ */
    --aka-hi:   #ff5a5f;
    --white:    #f6f1e7;   /* 生成り */
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    width: 100%;
    height: 100%;
    background: #000;
    overflow: hidden;
    font-family: "Yu Mincho", "YuMincho", "Hiragino Mincho ProN",
                 "Noto Serif JP", "Shippori Mincho", serif;
  }

  /* 16:9 のステージ。画面録画時はこの枠を撮る */
  #stage {
    position: absolute;
    inset: 0;
    margin: auto;
    aspect-ratio: 16 / 9;
    max-width: 100vw;
    max-height: 100vh;
    width: 100%;
    background:
      radial-gradient(120% 90% at 50% 18%, #1b2436 0%, var(--ink2) 42%, var(--ink) 100%);
    overflow: hidden;
    color: var(--white);
  }

  /* ── 背景の同心円（市場の照明のような光） ── */
  .halo {
    position: absolute;
    top: 40%;
    left: 50%;
    width: 140vh;
    height: 140vh;
    transform: translate(-50%, -50%) scale(0.6);
    border-radius: 50%;
    background: radial-gradient(circle,
      rgba(217,184,113,0.16) 0%,
      rgba(217,184,113,0.05) 34%,
      transparent 60%);
    opacity: 0;
    animation: haloIn 5.6s ease-out forwards;
    animation-delay: 0.2s;
  }
  @keyframes haloIn {
    0%   { opacity: 0;   transform: translate(-50%,-50%) scale(0.55); }
    30%  { opacity: 1;   transform: translate(-50%,-50%) scale(1.0); }
    100% { opacity: 0.7; transform: translate(-50%,-50%) scale(1.12); }
  }

  /* ── 金の細い横線（暖簾のライン） ── */
  .rule {
    position: absolute;
    left: 50%;
    height: 1px;
    background: linear-gradient(90deg, transparent, var(--gold), transparent);
    transform: translateX(-50%) scaleX(0);
    transform-origin: center;
    opacity: 0;
  }
  .rule.top    { top: 34%;   width: 46%; animation: ruleIn .9s cubic-bezier(.2,.7,.2,1) forwards 1.15s; }
  .rule.bottom { bottom: 33%;width: 46%; animation: ruleIn .9s cubic-bezier(.2,.7,.2,1) forwards 1.3s; }
  @keyframes ruleIn {
    from { transform: translateX(-50%) scaleX(0);   opacity: 0; }
    to   { transform: translateX(-50%) scaleX(1);   opacity: .9; }
  }

  /* ── 中央のロゴ群 ── */
  .center {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 2.2vh;
    text-align: center;
  }

  /* 小さな上書き「豊洲市場 まぐろ仲卸」 */
  .eyebrow {
    font-size: 2.0vh;
    letter-spacing: 0.7em;
    padding-left: 0.7em;
    color: var(--gold);
    opacity: 0;
    animation: fadeUp .9s ease-out forwards 1.5s;
  }

  /* メインの屋号「やま幸」 */
  .brand {
    display: flex;
    gap: 0.02em;
    font-weight: 700;
    font-size: 20vh;
    line-height: 1;
    color: var(--white);
    text-shadow: 0 0.4vh 3vh rgba(0,0,0,0.6);
  }
  .brand span {
    display: inline-block;
    opacity: 0;
    transform: translateY(0.5em) scale(1.08);
    filter: blur(6px);
    background: linear-gradient(180deg, var(--gold-hi), var(--gold) 55%, #b9924a);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    animation: charIn 1.0s cubic-bezier(.16,.9,.24,1) forwards;
  }
  .brand span:nth-child(1) { animation-delay: 0.35s; }
  .brand span:nth-child(2) { animation-delay: 0.6s; }
  .brand span:nth-child(3) { animation-delay: 0.85s; }
  @keyframes charIn {
    to { opacity: 1; transform: translateY(0) scale(1); filter: blur(0); }
  }

  /* 落款（赤い印） */
  .seal {
    position: absolute;
    right: 12%;
    top: 30%;
    width: 8.2vh;
    height: 8.2vh;
    border: 0.5vh solid var(--aka);
    border-radius: 12%;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--aka-hi);
    font-size: 3.0vh;
    line-height: 1.05;
    font-weight: 700;
    letter-spacing: -0.02em;
    box-shadow: 0 0 3vh rgba(209,39,58,0.35);
    opacity: 0;
    transform: rotate(-8deg) scale(1.5);
    animation: sealStamp .5s cubic-bezier(.2,1.4,.3,1) forwards 1.75s;
  }
  .seal span { transform: scale(.9); }
  @keyframes sealStamp {
    0%   { opacity: 0; transform: rotate(-8deg) scale(1.6); }
    60%  { opacity: 1; transform: rotate(-8deg) scale(0.92); }
    100% { opacity: 0.96; transform: rotate(-8deg) scale(1); }
  }

  /* サブタイトル（チャンネル名） */
  .sub {
    font-size: 2.6vh;
    letter-spacing: 0.42em;
    padding-left: 0.42em;
    color: var(--white);
    opacity: 0;
    animation: fadeUp 1.0s ease-out forwards 2.0s;
  }
  .sub b { color: var(--aka-hi); font-weight: 700; }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(1.2vh); }
    to   { opacity: 1; transform: translateY(0); }
  }

  /* ── YouTube 風の再生バー（下部の赤ライン） ── */
  .ytbar {
    position: absolute;
    left: 0; bottom: 0;
    height: 0.7vh;
    width: 0%;
    background: linear-gradient(90deg, var(--aka), var(--aka-hi));
    box-shadow: 0 0 2vh rgba(209,39,58,0.6);
    animation: fill 5.5s linear forwards 0.3s;
  }
  @keyframes fill { to { width: 100%; } }

  /* ── 粒子（きらめき） ── */
  .spark {
    position: absolute;
    width: 3px; height: 3px;
    background: var(--gold-hi);
    border-radius: 50%;
    opacity: 0;
    box-shadow: 0 0 8px 2px rgba(244,226,176,0.7);
    animation: spark 3.2s ease-in-out infinite;
  }
  @keyframes spark {
    0%, 100% { opacity: 0; transform: translateY(6px) scale(0.6); }
    50%      { opacity: 0.9; transform: translateY(-6px) scale(1); }
  }

  /* フェードアウト用の暗幕 */
  #fadeout {
    position: absolute;
    inset: 0;
    background: #000;
    opacity: 0;
    pointer-events: none;
    animation: outro 1.0s ease-in forwards 6.0s;
  }
  @keyframes outro { to { opacity: 1; } }

  /* リプレイボタン（録画には映らない・操作用） */
  #replay {
    position: fixed;
    right: 18px; bottom: 18px;
    z-index: 10;
    padding: 10px 16px;
    border: 1px solid var(--gold);
    border-radius: 999px;
    background: rgba(0,0,0,0.4);
    color: var(--gold-hi);
    font-family: system-ui, sans-serif;
    font-size: 13px;
    letter-spacing: 0.08em;
    cursor: pointer;
    opacity: 0.35;
    transition: opacity .2s;
  }
  #replay:hover { opacity: 1; }
</style>
</head>
<body>
  <div id="stage">
    <div class="halo"></div>

    <div class="rule top"></div>
    <div class="rule bottom"></div>

    <div class="seal"><span>本<br>鮪</span></div>

    <div class="center">
      <div class="eyebrow">豊 洲 市 場 ・ ま ぐ ろ 仲 卸</div>
      <div class="brand" aria-label="やま幸">
        <span>や</span><span>ま</span><span>幸</span>
      </div>
      <div class="sub"><b>YAMAKOH</b>　CHANNEL</div>
    </div>

    <div class="ytbar"></div>
    <div id="fadeout"></div>
  </div>

  <button id="replay">▶ もう一度再生</button>

  <script>
    // きらめき粒子をランダム配置
    const stage = document.getElementById('stage');
    function makeSparks() {
      for (let i = 0; i < 18; i++) {
        const s = document.createElement('div');
        s.className = 'spark';
        s.style.left = (10 + Math.random() * 80) + '%';
        s.style.top  = (18 + Math.random() * 64) + '%';
        s.style.animationDelay = (Math.random() * 3).toFixed(2) + 's';
        s.style.animationDuration = (2.4 + Math.random() * 1.6).toFixed(2) + 's';
        stage.appendChild(s);
      }
    }
    makeSparks();

    // リプレイ：ステージを作り直してアニメを再生
    document.getElementById('replay').addEventListener('click', () => {
      const clone = stage.cloneNode(true);
      stage.replaceWith(clone);
      // spark は clone にも入るが、再配置し直す
      clone.querySelectorAll('.spark').forEach(n => n.remove());
      const s2 = document.getElementById('stage') || clone;
      for (let i = 0; i < 18; i++) {
        const sp = document.createElement('div');
        sp.className = 'spark';
        sp.style.left = (10 + Math.random() * 80) + '%';
        sp.style.top  = (18 + Math.random() * 64) + '%';
        sp.style.animationDelay = (Math.random() * 3).toFixed(2) + 's';
        sp.style.animationDuration = (2.4 + Math.random() * 1.6).toFixed(2) + 's';
        clone.appendChild(sp);
      }
    });
  </script>
</body>
</html>
