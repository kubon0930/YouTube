  mat2 rot(float a){ float c=cos(a),s=sin(a); return mat2(c,-s,s,c); }
  float smin(float a,float b,float k){ float h=clamp(0.5+0.5*(b-a)/k,0.,1.); return mix(b,a,h)-k*h*(1.-h); }

  float caustic(vec2 uv){
    vec2 p = mod(uv*6.28318, 6.28318) - 250.0;
    vec2 i = vec2(p); float c = 1.0; float inten = 0.0045;
    for(int n=0;n<5;n++){
      float t = uT*0.35*(1.0 - (3.5/float(n+1)));
      i = p + vec2(cos(t - i.x)+sin(t+i.y), sin(t-i.y)+cos(t+i.x));
      c += 1.0/length(vec2(p.x/(sin(i.x+t)/inten), p.y/(cos(i.y+t)/inten)));
    }
    c /= 5.0; c = 1.17 - pow(c, 1.4);
    return clamp(pow(abs(c), 8.0), 0.0, 1.0);
  }

  float sph(vec3 p, vec3 c, float r){ vec3 d=p-c; d.z/=0.58; return length(d)-r; }
  float sdSeg(vec2 p, vec2 a, vec2 b){ vec2 pa=p-a, ba=b-a; float h=clamp(dot(pa,ba)/dot(ba,ba),0.,1.); return length(pa-ba*h); }
  float bodySDF(vec3 p){
    float k=0.19;
    float d = sph(p, vec3(1.12,0.0,0.0), 0.045);
    d = smin(d, sph(p, vec3(0.88,0.0,0.0),0.13), k);
    d = smin(d, sph(p, vec3(0.60,-0.01,0.0),0.195), k);
    d = smin(d, sph(p, vec3(0.30,-0.01,0.0),0.238), k);
    d = smin(d, sph(p, vec3(-0.02,0.0,0.0),0.245), k);
    d = smin(d, sph(p, vec3(-0.36,0.0,0.0),0.215), k);
    d = smin(d, sph(p, vec3(-0.66,0.0,0.0),0.155), k);
    d = smin(d, sph(p, vec3(-0.92,0.0,0.0),0.095), k);
    d = smin(d, sph(p, vec3(-1.12,0.0,0.0),0.05), k);
    return d;
  }
  // fins-only SDF (for material split)
  float finsSDF(vec3 p){
    // forked caudal tail, attached at peduncle (local x ~ -1.05)
    float th = abs(p.z) - 0.02;
    float up = sdSeg(p.xy, vec2(-1.02,0.0), vec2(-1.62, 0.52)) - 0.055;
    float lo = sdSeg(p.xy, vec2(-1.02,0.0), vec2(-1.62,-0.52)) - 0.055;
    float tail = max(min(up,lo), th);
    // first dorsal fin
    vec3 d1 = p - vec3(0.02,0.24,0.0);
    float dtri = max(d1.y*0.9 + abs(d1.x)*1.9 - 0.10, -d1.y-0.17);
    float dorsal = max(dtri, abs(p.z)-0.013);
    // anal fin (bottom rear)
    vec3 a1 = p - vec3(-0.42,-0.22,0.0);
    float atri = max(-a1.y*1.1 + abs(a1.x)*2.3 - 0.04, a1.y-0.11);
    float anal = max(atri, abs(p.z)-0.012);
    // pectoral fins (both sides), small, hugging body
    vec3 pf = vec3(p.x-0.34, p.y+0.05, abs(p.z)-0.12);
    float ptri = max(pf.x*2.3 + abs(pf.y)*2.0 - 0.01, -pf.x-0.16);
    float pect = max(ptri, abs(pf.z)-0.014);
    return min(min(min(tail, dorsal), anal), pect);
  }
  float sdFish(vec3 p){ return min(bodySDF(p), finsSDF(p)); }

  float fishYaw; vec3 fishPos;
  float mapFish(vec3 wp){
    vec3 q = wp - fishPos;
    q.xz = rot(fishYaw)*q.xz;
    q.x = -q.x;              // face -x (direction of travel = left)
    q /= S;
    float wave = sin(q.x*2.4 - uT*6.5);
    q.y += 0.03*wave*smoothstep(-1.2,0.5,q.x);
    q.z += 0.06*sin(q.x*2.0 - uT*6.5)*smoothstep(-1.2,-0.3,q.x);
    return sdFish(q)*S*0.7;
  }
  vec3 nFish(vec3 p){
    vec2 e = vec2(0.0016,0.0);
    return normalize(vec3(
      mapFish(p+e.xyy)-mapFish(p-e.xyy),
      mapFish(p+e.yxy)-mapFish(p-e.yxy),
      mapFish(p+e.yyx)-mapFish(p-e.yyx)));
  }

  vec3 background(vec3 rd, vec2 uv){
    float h = smoothstep(-0.7, 0.9, rd.y);
    vec3 deep = vec3(0.010, 0.055, 0.11);
    vec3 mid  = vec3(0.02, 0.19, 0.34);
    vec3 hi   = vec3(0.07, 0.44, 0.64);
    vec3 col = mix(deep, mix(mid, hi, h), h);
    // god rays (screen-space, seamless)
    float ra = uv.x / (uv.y + 1.7);
    float rays = (0.5+0.5*sin(ra*42.0 + uT*0.30)) * (0.4+0.6*sin(ra*18.0 - uT*0.19));
    rays = pow(max(rays,0.0), 2.6) * smoothstep(-0.25,0.75,rd.y);
    col += vec3(0.14,0.36,0.52) * rays * 0.55;
    // caustic haze (screen-space)
    float ca = caustic(vec2(uv.x*2.0, uv.y*2.0 - uT*0.05));
    col += vec3(0.18,0.46,0.68) * ca * 0.5 * smoothstep(-0.35,0.9,rd.y);
    return col;
  }

  void main(){
    vec2 uv = (gl_FragCoord.xy - 0.5*uRes) / uRes.y;

    float prog = clamp((uT-0.3)/8.2, 0.0, 1.0);
    fishPos = vec3(mix(3.6,-3.8, prog), -0.98 + 0.05*sin(uT*0.7), mix(-1.2,-2.2, prog));
    fishYaw = 0.30 + 0.05*sin(uT*0.6);

    vec3 ro = vec3(0.0, 0.05, 4.2);
    vec3 ta = vec3(0.0, -0.15, 0.0);
    vec3 ww = normalize(ta-ro), uu = normalize(cross(ww,vec3(0,1,0))), vv = cross(uu,ww);
    vec3 rd = normalize(uv.x*uu + uv.y*vv + 1.7*ww);

    vec3 col = background(rd, uv);

    float t = 1.5, dmin = 1e9; bool hit=false;
    for(int i=0;i<96;i++){
      vec3 p = ro + rd*t;
      float d = mapFish(p);
      dmin = min(dmin, d);
      if(d < 0.0025){ hit=true; break; }
      t += d*0.9;
      if(t > 8.5) break;
    }

    if(hit){
      vec3 p = ro + rd*t;
      vec3 n = nFish(p);
      vec3 l = normalize(vec3(-0.30, 0.85, 0.45));
      float diff = clamp(dot(n,l), 0.0, 1.0);
      float amb = 0.42 + 0.22*n.y;

      vec3 q = p - fishPos; q.xz = rot(fishYaw)*q.xz; q.x=-q.x; q/=S;
      float ly = q.y;
      bool isFin = bodySDF(q) > 0.03;

      // body: counter-shaded metallic (dark steel-blue back -> silver -> pale belly)
      vec3 back  = vec3(0.09,0.20,0.33);
      vec3 flank = vec3(0.44,0.56,0.63);
      vec3 belly = vec3(0.82,0.87,0.90);
      vec3 base = mix(belly, mix(flank, back, smoothstep(0.0,0.34,ly)), smoothstep(-0.28,0.16,ly));
      // fins: uniform dark steel
      if(isFin) base = vec3(0.12,0.22,0.34);

      float bc = caustic(p.xz*2.2 + vec2(0.0,uT*0.1));
      vec3 lit = base*(amb + diff*0.9) + vec3(0.25,0.5,0.7)*bc*diff*(isFin?0.2:0.45);

      vec3 hh = normalize(l - rd);
      float spec = pow(clamp(dot(n,hh),0.0,1.0), 80.0);
      lit += vec3(0.7,0.85,1.0)*spec*(isFin?0.3:0.9);

      float fr = pow(1.0 - clamp(dot(n,-rd),0.0,1.0), 3.0);
      lit += vec3(0.2,0.55,0.9)*fr*(isFin?0.9:0.6);

      // eye
      float ed = length(vec3(q.x-0.82, q.y-0.05, abs(q.z)-0.11));
      if(!isFin) lit = mix(vec3(0.02,0.02,0.04), lit, smoothstep(0.05,0.085,ed));

      float fog = 1.0 - exp(-max(t-3.2,0.0)*0.13);
      lit = mix(lit, background(rd, uv), fog*0.5);

      col = lit;
    } else {
      col += vec3(0.12,0.34,0.52) * smoothstep(0.22,0.0,dmin) * 0.18;
    }

    col = pow(col, vec3(0.92));
    float vig = smoothstep(1.4, 0.4, length(uv));
    col *= mix(0.62, 1.0, vig);

    gl_FragColor = vec4(col, 1.0);
  }`;

  function sh(type, src){ const s=gl.createShader(type); gl.shaderSource(s,src); gl.compileShader(s);
    if(!gl.getShaderParameter(s,gl.COMPILE_STATUS)) console.error(gl.getShaderInfoLog(s)); return s; }
  const prog = gl.createProgram();
  gl.attachShader(prog, sh(gl.VERTEX_SHADER, VS));
  gl.attachShader(prog, sh(gl.FRAGMENT_SHADER, FS));
  gl.linkProgram(prog); gl.useProgram(prog);
  const buf = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, buf);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 3,-1, -1,3]), gl.STATIC_DRAW);
  const loc = gl.getAttribLocation(prog,'p'); gl.enableVertexAttribArray(loc);
  gl.vertexAttribPointer(loc,2,gl.FLOAT,false,0,0);
  const uRes = gl.getUniformLocation(prog,'uRes'), uT = gl.getUniformLocation(prog,'uT');
  gl.viewport(0,0,W,H);
  function renderGL(t){ gl.uniform2f(uRes,W,H); gl.uniform1f(uT,t); gl.drawArrays(gl.TRIANGLES,0,3); }

  const logo = new Image();
  logo.src = document.getElementById('logo').textContent.trim();

  // marine snow
  const snow = Array.from({length:80}, () => ({
    x:Math.random()*W, y:Math.random()*H, r:Math.random()*2.0+0.5,
    vx:-(Math.random()*8+2), vy:(Math.random()*10+4), a:Math.random()*6.28, tw:Math.random()*2+.5
  }));

  const clamp01 = x => x<0?0:x>1?1:x;
  const seg = (t,s,d) => clamp01((t-s)/d);
  const eo3 = x => 1-Math.pow(1-x,3);
  const ei3 = x => x*x*x;

  function tracked(text, cx, cy, size, spacing, color, alpha){
    ctx.font = `500 ${size}px "Helvetica Neue",Arial,sans-serif`;
    ctx.textBaseline='middle'; ctx.textAlign='left'; ctx.globalAlpha=alpha;
    const chars=[...text], w=chars.map(c=>ctx.measureText(c).width);
    const total=w.reduce((a,b)=>a+b,0)+spacing*(chars.length-1);
    let x=cx-total/2; ctx.fillStyle=color;
    chars.forEach((c,i)=>{ ctx.fillText(c,x,cy); x+=w[i]+spacing; });
    ctx.globalAlpha=1;
  }

  let lastT = 0;
  function marineSnow(t){
    const dt = Math.min(Math.max(t-lastT, 0), 0.05); lastT = t;
    ctx.save(); ctx.globalCompositeOperation='lighter';
    for(const s of snow){
      s.x += s.vx*dt; s.y += s.vy*dt; s.a += s.tw*dt;
      if(s.y>H+6){ s.y=-6; s.x=Math.random()*W; } if(s.x<-6){ s.x=W+6; }
      const g = .25 + .35*(Math.sin(s.a)*.5+.5);
      const rg = ctx.createRadialGradient(s.x,s.y,0,s.x,s.y,s.r*4);
      rg.addColorStop(0,`rgba(200,230,255,${g.toFixed(3)})`); rg.addColorStop(1,'rgba(140,200,255,0)');
      ctx.fillStyle=rg; ctx.beginPath(); ctx.arc(s.x,s.y,s.r*4,0,7); ctx.fill();
    }
    ctx.restore();
  }

  const LOGO_Y = H*0.44;
  function logoDims(){ const lw=W*0.44; return { lw, lh: lw*logo.height/logo.width }; }

  function overlay(t){
    marineSnow(t);
    const p = eo3(seg(t,1.1,1.3));
    if(p>0 && logo.complete && logo.width){
      const {lw,lh}=logoDims(); const scale=1.05-0.05*p, dw=lw*scale, dh=lh*scale;
      ctx.save(); ctx.globalAlpha=p;
      ctx.shadowColor='rgba(120,200,255,0.5)'; ctx.shadowBlur=44;
      ctx.drawImage(logo, W/2-dw/2, LOGO_Y-dh/2, dw, dh);
      ctx.restore();
    }
    const gp = eo3(seg(t,2.3,0.9));
    if(gp>0 && logo.width){
      const {lh}=logoDims(); const full=W*0.44*0.30, y=LOGO_Y + lh/2 + 26;
      ctx.strokeStyle='#46b446'; ctx.lineWidth=3; ctx.globalAlpha=0.95;
      ctx.beginPath(); ctx.moveTo(W/2-full/2*gp, y); ctx.lineTo(W/2+full/2*gp, y); ctx.stroke();
      ctx.globalAlpha=1;
    }
    const tp = eo3(seg(t,2.8,1.0));
    if(tp>0 && logo.width){
      const {lh}=logoDims(); const y=LOGO_Y + lh/2 + 74;
      tracked('T O Y O S U   F I S H   M A R K E T', W/2, y, 26, 3, '#bcdcf5', tp*0.95);
    }
    const pw = eo3(seg(t,0.4,8.0))*W;
    const g = ctx.createLinearGradient(0,0,W,0);
    g.addColorStop(0,'#0064aa'); g.addColorStop(.7,'#2e9fd6'); g.addColorStop(1,'#46b446');
    ctx.fillStyle=g; ctx.fillRect(0,H-6,pw,6);
    const fa = ei3(seg(t,8.4,1.1));
    if(fa>0){ ctx.fillStyle=`rgba(0,0,0,${fa})`; ctx.fillRect(0,0,W,H); }
  }

  function frame(t){
    renderGL(t);
    ctx.clearRect(0,0,W,H);
    ctx.drawImage(gl_c, 0, 0, W, H);
    overlay(t);
  }

  let startMs=performance.now(), playing=true, holdT=0;
  function loop(now){
    let t = playing ? (now-startMs)/1000 : holdT;
    if(t>=END){ t=END; playing=false; holdT=END; }
    frame(t); requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
  function play(){ startMs=performance.now(); playing=true; lastT=0; }
  window.__seek = (v)=>{ playing=false; holdT=v; lastT=v-0.016; };

  let ac=null, dest=null, master=null;
  function ensureAudio(){
    if(ac) return;
    ac=new (window.AudioContext||window.webkitAudioContext)();
    master=ac.createGain(); master.gain.value=.85;
    const comp=ac.createDynamicsCompressor(); master.connect(comp); comp.connect(ac.destination);
    dest=ac.createMediaStreamDestination(); comp.connect(dest);
  }
  function noise(dur){ const b=ac.createBuffer(1,ac.sampleRate*dur,ac.sampleRate); const d=b.getChannelData(0);
    for(let i=0;i<d.length;i++) d[i]=Math.random()*2-1; return b; }
  function ocean(at){
    const n=ac.createBufferSource(); n.buffer=noise(10); n.loop=true;
    const lp=ac.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=420;
    const g=ac.createGain(); g.gain.setValueAtTime(0.0001,at); g.gain.linearRampToValueAtTime(0.10,at+1.5);
    g.gain.setValueAtTime(0.10,at+7.0); g.gain.exponentialRampToValueAtTime(0.0001,at+9.3);
    const lfo=ac.createOscillator(), lg=ac.createGain(); lfo.frequency.value=0.15; lg.gain.value=0.04;
    lfo.connect(lg); lg.connect(g.gain); lfo.start(at); lfo.stop(at+9.5);
    n.connect(lp); lp.connect(g); g.connect(master); n.start(at); n.stop(at+9.5);
    const o=ac.createOscillator(), og=ac.createGain(); o.type='sine'; o.frequency.value=48;
    og.gain.setValueAtTime(0.0001,at); og.gain.linearRampToValueAtTime(0.14,at+1.5);
    og.gain.setValueAtTime(0.14,at+7.0); og.gain.exponentialRampToValueAtTime(0.0001,at+9.3);
    o.connect(og); og.connect(master); o.start(at); o.stop(at+9.5);
  }
  function swell(at){
    const o=ac.createOscillator(), g=ac.createGain(); o.type='triangle';
    o.frequency.setValueAtTime(120,at); o.frequency.exponentialRampToValueAtTime(55,at+0.7);
    g.gain.setValueAtTime(0.0001,at); g.gain.exponentialRampToValueAtTime(0.8,at+0.02); g.gain.exponentialRampToValueAtTime(0.0001,at+1.3);
    o.connect(g); g.connect(master); o.start(at); o.stop(at+1.4);
  }
  function shimmer(at){
    const n=ac.createBufferSource(); n.buffer=noise(1.4);
    const bp=ac.createBiquadFilter(); bp.type='bandpass'; bp.Q.value=1.2;
    bp.frequency.setValueAtTime(600,at); bp.frequency.exponentialRampToValueAtTime(5000,at+1.1);
    const g=ac.createGain(); g.gain.setValueAtTime(0.0001,at); g.gain.linearRampToValueAtTime(0.12,at+0.3); g.gain.exponentialRampToValueAtTime(0.0001,at+1.3);
    n.connect(bp); bp.connect(g); g.connect(master); n.start(at); n.stop(at+1.4);
  }
  function whoosh(at){
    const n=ac.createBufferSource(); n.buffer=noise(0.9);
    const bp=ac.createBiquadFilter(); bp.type='bandpass'; bp.Q.value=0.7;
    bp.frequency.setValueAtTime(300,at); bp.frequency.exponentialRampToValueAtTime(1400,at+0.5);
    const g=ac.createGain(); g.gain.setValueAtTime(0.0001,at); g.gain.linearRampToValueAtTime(0.18,at+0.2); g.gain.exponentialRampToValueAtTime(0.0001,at+0.7);
    n.connect(bp); bp.connect(g); g.connect(master); n.start(at); n.stop(at+0.9);
  }
  function score(){ if(!ac) return; const t0=ac.currentTime+0.05;
    ocean(t0); swell(t0+1.1); shimmer(t0+1.2); whoosh(t0+3.6); }

  document.getElementById('replay').addEventListener('click', async()=>{
    ensureAudio(); if(ac.state==='suspended') await ac.resume(); play(); score();
  });
  const dl=document.getElementById('download');
  dl.addEventListener('click', async()=>{
    ensureAudio(); if(ac.state==='suspended') await ac.resume();
    const mimes=['video/webm;codecs=vp9,opus','video/webm;codecs=vp8,opus','video/webm'];
    const mime=mimes.find(m=>window.MediaRecorder&&MediaRecorder.isTypeSupported(m));
    if(!mime){ alert('このブラウザは録画に未対応です。画面録画をご利用ください。'); return; }
    dl.disabled=true; const lb=dl.textContent; dl.textContent='● 録画中…';
    const vs=view.captureStream(30);
    const stream=new MediaStream([...vs.getVideoTracks(), ...dest.stream.getAudioTracks()]);
    const chunks=[]; const rec=new MediaRecorder(stream,{mimeType:mime,videoBitsPerSecond:14e6});
    rec.ondataavailable=e=>{ if(e.data.size) chunks.push(e.data); };
    rec.onstop=()=>{ const blob=new Blob(chunks,{type:'video/webm'});
      const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='yamayuki-intro.webm';
      document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(a.href),4000);
      dl.disabled=false; dl.textContent=lb; };
    play(); score(); rec.start();
    setTimeout(()=>rec.stop(), (END+0.3)*1000);
  });
})();
</script>
</body>
