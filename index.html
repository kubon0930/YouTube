<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>やま幸 YAMAYUKI — Cinematic Intro</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body {
    width:100%; height:100%; background:#000; overflow:hidden;
    font-family:"Optima","Palatino Linotype","Georgia",system-ui,sans-serif;
    color:#f4eede;
  }
  #wrap { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; }
  canvas {
    max-width:100vw; max-height:100vh; width:auto; height:auto;
    aspect-ratio:16/9; box-shadow:0 0 80px rgba(0,0,0,.8);
    background:#05070e;
  }
  .ui {
    position:fixed; left:0; right:0; bottom:22px; z-index:20;
    display:flex; gap:12px; align-items:center; justify-content:center;
    opacity:.9; transition:opacity .25s;
  }
  .ui:hover { opacity:1; }
  button {
    padding:11px 20px; border:1px solid #c9a25a; border-radius:999px;
    background:rgba(8,10,18,.6); color:#f7e6b4; backdrop-filter:blur(6px);
    font:500 13px/1 "Optima","Georgia",system-ui,sans-serif; letter-spacing:.09em;
    cursor:pointer; transition:all .2s;
  }
  button:hover:not(:disabled) { background:rgba(201,162,90,.16); color:#fffdf3; }
  button:disabled { opacity:.5; cursor:default; }
  button.primary { border-color:#c31f2d; color:#ff9a9a; }
  button.primary:hover:not(:disabled) { background:rgba(195,31,45,.18); color:#fff; }
  #hint { position:fixed; top:16px; left:0; right:0; text-align:center; z-index:20;
    font-size:12px; letter-spacing:.14em; color:rgba(201,162,90,.55); pointer-events:none; }
</style>
</head>
<body>
  <div id="wrap"><canvas id="fx" width="1920" height="1080"></canvas></div>
  <div id="hint">YAMAYUKI · TOYOSU</div>
  <div class="ui">
    <button id="replay">▶ 再生（音あり）</button>
    <button id="download" class="primary">⬇ 動画をダウンロード（WebM）</button>
  </div>

<script>
(() => {
  const W = 1920, H = 1080, END = 8.8;
  const cv = document.getElementById('fx');
  const ctx = cv.getContext('2d');

  const JP = '700 {s}px "Yu Mincho","YuMincho","Hiragino Mincho ProN","Noto Serif JP","Shippori Mincho",serif';
  const EN = '{w} {s}px "Optima","Palatino Linotype","Baskerville","Georgia",serif';

  // ── easing / utils ──
  const clamp01 = x => x < 0 ? 0 : x > 1 ? 1 : x;
  const seg = (t, s, d) => clamp01((t - s) / d);
  const eo3 = x => 1 - Math.pow(1 - x, 3);
  const ei3 = x => x * x * x;
  const eoBack = x => { const c = 1.9; return 1 + (c + 1) * Math.pow(x - 1, 3) + c * Math.pow(x - 1, 2); };

  // ── particles (gold motes) ──
  let motes = [];
  function seedMotes() {
    motes = Array.from({ length: 90 }, () => ({
      x: Math.random() * W, y: Math.random() * H,
      r: Math.random() * 2.2 + 0.6,
      vy: -(Math.random() * 12 + 3), vx: (Math.random() - .5) * 8,
      a: Math.random() * Math.PI * 2, tw: Math.random() * 2 + .6
    }));
  }
  seedMotes();

  // ── tracked text ──
  function tracked(text, cx, cy, size, spacing, weight, family, fill) {
    ctx.font = (family === 'jp' ? JP : EN).replace('{s}', size).replace('{w}', weight || '400');
    ctx.textBaseline = 'middle'; ctx.textAlign = 'left';
    const chars = [...text];
    const widths = chars.map(c => ctx.measureText(c).width);
    const total = widths.reduce((a, b) => a + b, 0) + spacing * (chars.length - 1);
    let x = cx - total / 2;
    ctx.fillStyle = fill;
    chars.forEach((c, i) => { ctx.fillText(c, x, cy); x += widths[i] + spacing; });
  }

  // ── scene layers ──
  function background() {
    const g = ctx.createRadialGradient(W * .5, H * .06, 120, W * .5, H * .5, H * 1.15);
    g.addColorStop(0, '#1b2c49'); g.addColorStop(.42, '#0c1322'); g.addColorStop(1, '#05070e');
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  }

  function rays(t) {
    ctx.save();
    ctx.globalCompositeOperation = 'screen';
    ctx.translate(W * .5, -H * .25);
    ctx.rotate(Math.sin(t * .12) * .12);
    const n = 13;
    for (let i = 0; i < n; i++) {
      const ang = (i / n) * Math.PI * 2 + t * .05;
      ctx.save(); ctx.rotate(ang);
      const grd = ctx.createLinearGradient(0, 0, 0, H * 1.6);
      grd.addColorStop(0, 'rgba(201,162,90,0.05)');
      grd.addColorStop(1, 'rgba(201,162,90,0)');
      ctx.fillStyle = grd;
      ctx.beginPath(); ctx.moveTo(-26, 0); ctx.lineTo(26, 0); ctx.lineTo(90, H * 1.6); ctx.lineTo(-90, H * 1.6); ctx.closePath(); ctx.fill();
      ctx.restore();
    }
    ctx.restore();
  }

  function particles(dt, t) {
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    for (const p of motes) {
      p.y += p.vy * dt; p.x += p.vx * dt; p.a += p.tw * dt;
      if (p.y < -8) { p.y = H + 8; p.x = Math.random() * W; }
      if (p.x < -8) p.x = W + 8; if (p.x > W + 8) p.x = -8;
      const glow = .3 + .5 * (Math.sin(p.a) * .5 + .5);
      const rg = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, p.r * 5);
      rg.addColorStop(0, `rgba(247,230,180,${(glow).toFixed(3)})`);
      rg.addColorStop(1, 'rgba(201,162,90,0)');
      ctx.fillStyle = rg;
      ctx.beginPath(); ctx.arc(p.x, p.y, p.r * 5, 0, 7); ctx.fill();
    }
    ctx.restore();
  }

  function frame(t) {
    const ix = W * .09, iy = H * .075, rx = W * .91, ry = H * .925;
    ctx.strokeStyle = '#c9a25a'; ctx.lineWidth = 2; ctx.globalAlpha = .85;
    const dh = eo3(seg(t, .35, 1.0)), dv = eo3(seg(t, .5, 1.0));
    line(ix, iy, ix + (rx - ix) * dh, iy);          // top L→R
    line(rx, ry, rx - (rx - ix) * dh, ry);          // bottom R→L
    line(ix, iy, ix, iy + (ry - iy) * dv);          // left T→B
    line(rx, ry, rx, ry - (ry - iy) * dv);          // right B→T
    ctx.globalAlpha = 1;
    function line(x1, y1, x2, y2) { ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke(); }
  }

  function eyebrow(t) {
    const a = eo3(seg(t, 1.5, 1.0)); if (!a) return;
    ctx.globalAlpha = a;
    tracked('TOYOSU  FISH  MARKET', W * .5, H * .285, 30, 12, '500', 'en', '#f7e6b4');
    // side rules
    ctx.strokeStyle = '#c9a25a'; ctx.lineWidth = 1.4;
    const w = 70, y = H * .285, gap = 250;
    grad(W * .5 - gap - w, y, W * .5 - gap, y); grad(W * .5 + gap, y, W * .5 + gap + w, y);
    ctx.globalAlpha = 1;
    function grad(x1, yy, x2, y2) {
      const g = ctx.createLinearGradient(x1, 0, x2, 0);
      g.addColorStop(0, 'rgba(201,162,90,0)'); g.addColorStop(1, 'rgba(201,162,90,.9)');
      ctx.strokeStyle = g; ctx.beginPath(); ctx.moveTo(x1, yy); ctx.lineTo(x2, y2); ctx.stroke();
    }
  }

  function brand(t) {
    const wipe = eo3(seg(t, .8, 1.2)); if (!wipe) return;
    const fs = 300, cx = W * .5, cy = H * .46;
    ctx.save();
    ctx.font = JP.replace('{s}', fs);
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    const tw = ctx.measureText('やま幸').width, pad = 30;
    // reveal clip (left→right)
    const clipX = cx - tw / 2 - pad, clipW = (tw + pad * 2) * wipe;
    ctx.beginPath(); ctx.rect(clipX, cy - fs * .75, clipW, fs * 1.5); ctx.clip();
    // metallic vertical foil
    const g = ctx.createLinearGradient(0, cy - fs * .55, 0, cy + fs * .55);
    g.addColorStop(0, '#8a6a30'); g.addColorStop(.34, '#e9d29a'); g.addColorStop(.5, '#fffdf3');
    g.addColorStop(.54, '#f7e6b4'); g.addColorStop(.68, '#d8bd7e'); g.addColorStop(1, '#7d5f2c');
    ctx.shadowColor = 'rgba(0,0,0,.55)'; ctx.shadowBlur = 40; ctx.shadowOffsetY = 14;
    ctx.fillStyle = g; ctx.fillText('やま幸', cx, cy);
    // specular sheen sweep (additive, clipped to glyphs by same fill)
    const sp = seg(t, 1.7, 1.7);
    if (sp > 0 && sp < 1) {
      ctx.shadowBlur = 0; ctx.shadowOffsetY = 0;
      ctx.globalCompositeOperation = 'lighter';
      const bandW = tw * .5;
      const lx = cx - tw / 2 - bandW + sp * (tw + bandW * 2);
      const sg = ctx.createLinearGradient(lx - bandW, 0, lx + bandW, 0);
      sg.addColorStop(0, 'rgba(255,255,255,0)'); sg.addColorStop(.5, 'rgba(255,255,255,.75)');
      sg.addColorStop(1, 'rgba(255,255,255,0)');
      ctx.fillStyle = sg; ctx.fillText('やま幸', cx, cy);
    }
    ctx.restore();
  }

  function seal(t) {
    const p = seg(t, 2.15, .55); if (!p) return;
    const s = 1.7 - .7 * eoBack(p), a = clamp01(p * 2) * .97;
    const cx = W * .77, cy = H * .29, sz = 130 * s;
    ctx.save();
    ctx.translate(cx, cy); ctx.rotate(-7 * Math.PI / 180); ctx.globalAlpha = a;
    ctx.strokeStyle = '#c31f2d'; ctx.lineWidth = 8;
    ctx.shadowColor = 'rgba(195,31,45,.5)'; ctx.shadowBlur = 34;
    roundRect(-sz / 2, -sz / 2, sz, sz, sz * .16); ctx.stroke();
    ctx.shadowBlur = 0;
    ctx.fillStyle = '#ff5252';
    ctx.font = JP.replace('{s}', 48 * s); ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText('本', 0, -30 * s); ctx.fillText('鮪', 0, 30 * s);
    ctx.restore();
    function roundRect(x, y, w, h, r) {
      ctx.beginPath(); ctx.moveTo(x + r, y);
      ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
      ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
    }
  }

  function wordmark(t) {
    const letters = [...'YAMAYUKI'];
    const size = 66, spacing = 30, cx = W * .5, cy = H * .63;
    ctx.font = EN.replace('{w}', '500').replace('{s}', size);
    ctx.textBaseline = 'middle'; ctx.textAlign = 'left';
    const widths = letters.map(c => ctx.measureText(c).width);
    const total = widths.reduce((a, b) => a + b, 0) + spacing * (letters.length - 1);
    let x = cx - total / 2;
    letters.forEach((c, i) => {
      const p = eo3(seg(t, 2.35 + i * .07, .8));
      ctx.globalAlpha = p; ctx.fillStyle = '#f4eede';
      ctx.fillText(c, x, cy + (1 - p) * 22);
      x += widths[i] + spacing;
    });
    ctx.globalAlpha = 1;
  }

  function tagline(t) {
    const a = eo3(seg(t, 3.1, 1.0)); if (!a) return;
    ctx.globalAlpha = a;
    tracked('BLUEFIN  TUNA  WHOLESALER   ·   TOKYO', W * .5, H * .715, 24, 8, '500', 'en', '#c9a25a');
    ctx.globalAlpha = 1;
  }

  function progress(t) {
    const w = eo3(seg(t, .4, 7.4)) * W;
    const g = ctx.createLinearGradient(0, 0, W, 0);
    g.addColorStop(0, '#c9a25a'); g.addColorStop(.6, '#f7e6b4'); g.addColorStop(1, '#c31f2d');
    ctx.fillStyle = g; ctx.fillRect(0, H - 7, w, 7);
  }

  function fadeout(t) {
    const a = ei3(seg(t, 7.6, 1.1)); if (!a) return;
    ctx.fillStyle = `rgba(0,0,0,${a})`; ctx.fillRect(0, 0, W, H);
  }

  function render(t, dt) {
    background(); rays(t); particles(dt, t);
    frame(t); eyebrow(t); brand(t); seal(t); wordmark(t); tagline(t);
    progress(t); fadeout(t);
  }

  // ── playback loop ──
  let startMs = performance.now(), last = startMs, playing = true, holdT = 0;
  function loop(now) {
    const dt = Math.min((now - last) / 1000, .05); last = now;
    let t = playing ? (now - startMs) / 1000 : holdT;
    if (t >= END) { t = END; playing = false; holdT = END; }
    render(t, dt);
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);

  function play() { startMs = performance.now(); last = startMs; playing = true; }

  // ── Web Audio (synthesized cinematic score) ──
  let ac = null, audioDest = null, master = null;
  function ensureAudio() {
    if (ac) return;
    ac = new (window.AudioContext || window.webkitAudioContext)();
    master = ac.createGain(); master.gain.value = .8;
    const comp = ac.createDynamicsCompressor();
    master.connect(comp); comp.connect(ac.destination);
    audioDest = ac.createMediaStreamDestination(); comp.connect(audioDest);
  }
  function noiseBuf(dur) {
    const b = ac.createBuffer(1, ac.sampleRate * dur, ac.sampleRate);
    const d = b.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    return b;
  }
  function boom(at) {
    const o = ac.createOscillator(), g = ac.createGain();
    o.type = 'triangle'; o.frequency.setValueAtTime(95, at); o.frequency.exponentialRampToValueAtTime(44, at + .5);
    g.gain.setValueAtTime(.0001, at); g.gain.exponentialRampToValueAtTime(1.0, at + .012);
    g.gain.exponentialRampToValueAtTime(.0001, at + 1.0);
    o.connect(g); g.connect(master); o.start(at); o.stop(at + 1.1);
    const n = ac.createBufferSource(); n.buffer = noiseBuf(.3);
    const lp = ac.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 220;
    const ng = ac.createGain(); ng.gain.setValueAtTime(.5, at); ng.gain.exponentialRampToValueAtTime(.0001, at + .28);
    n.connect(lp); lp.connect(ng); ng.connect(master); n.start(at); n.stop(at + .3);
  }
  function shimmer(at) {
    [2400, 3100, 3900, 5200, 6600].forEach((f, i) => {
      const o = ac.createOscillator(), g = ac.createGain();
      o.type = 'sine'; o.frequency.value = f;
      const st = at + i * .04;
      g.gain.setValueAtTime(.0001, st); g.gain.exponentialRampToValueAtTime(.06, st + .01);
      g.gain.exponentialRampToValueAtTime(.0001, st + .7);
      o.connect(g); g.connect(master); o.start(st); o.stop(st + .75);
    });
  }
  function whoosh(at) {
    const n = ac.createBufferSource(); n.buffer = noiseBuf(.7);
    const bp = ac.createBiquadFilter(); bp.type = 'bandpass'; bp.Q.value = .8;
    bp.frequency.setValueAtTime(400, at); bp.frequency.exponentialRampToValueAtTime(3200, at + .5);
    const g = ac.createGain();
    g.gain.setValueAtTime(.0001, at); g.gain.linearRampToValueAtTime(.22, at + .18);
    g.gain.exponentialRampToValueAtTime(.0001, at + .6);
    n.connect(bp); bp.connect(g); g.connect(master); n.start(at); n.stop(at + .7);
  }
  function stampHit(at) {
    const n = ac.createBufferSource(); n.buffer = noiseBuf(.2);
    const lp = ac.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 900;
    const g = ac.createGain(); g.gain.setValueAtTime(.5, at); g.gain.exponentialRampToValueAtTime(.0001, at + .14);
    n.connect(lp); lp.connect(g); g.connect(master); n.start(at); n.stop(at + .2);
    const o = ac.createOscillator(), og = ac.createGain();
    o.type = 'square'; o.frequency.setValueAtTime(190, at); o.frequency.exponentialRampToValueAtTime(70, at + .1);
    og.gain.setValueAtTime(.3, at); og.gain.exponentialRampToValueAtTime(.0001, at + .12);
    o.connect(og); og.connect(master); o.start(at); o.stop(at + .13);
  }
  function drone(at) {
    const o = ac.createOscillator(), o2 = ac.createOscillator(), g = ac.createGain();
    o.type = 'sine'; o.frequency.value = 55; o2.type = 'sine'; o2.frequency.value = 82.5;
    g.gain.setValueAtTime(.0001, at); g.gain.linearRampToValueAtTime(.12, at + 1.2);
    g.gain.setValueAtTime(.12, at + 6.4); g.gain.exponentialRampToValueAtTime(.0001, at + 8.6);
    o.connect(g); o2.connect(g); g.connect(master); o.start(at); o2.start(at); o.stop(at + 8.7); o2.stop(at + 8.7);
  }
  function score() {
    if (!ac) return;
    const t0 = ac.currentTime + .06;
    drone(t0 + .3); boom(t0 + .8); shimmer(t0 + 1.7); stampHit(t0 + 2.15); whoosh(t0 + 2.35);
  }

  // ── controls ──
  document.getElementById('replay').addEventListener('click', async () => {
    ensureAudio(); if (ac.state === 'suspended') await ac.resume();
    play(); score();
  });

  const dlBtn = document.getElementById('download');
  dlBtn.addEventListener('click', async () => {
    ensureAudio(); if (ac.state === 'suspended') await ac.resume();
    const mimes = ['video/webm;codecs=vp9,opus', 'video/webm;codecs=vp8,opus', 'video/webm'];
    const mime = mimes.find(m => window.MediaRecorder && MediaRecorder.isTypeSupported(m));
    if (!mime) { alert('お使いのブラウザは録画に未対応です。画面録画をご利用ください。'); return; }
    dlBtn.disabled = true; const label = dlBtn.textContent; dlBtn.textContent = '● 録画中…';
    const vs = cv.captureStream(30);
    const stream = new MediaStream([...vs.getVideoTracks(), ...audioDest.stream.getAudioTracks()]);
    const chunks = [];
    const rec = new MediaRecorder(stream, { mimeType: mime, videoBitsPerSecond: 12e6 });
    rec.ondataavailable = e => { if (e.data.size) chunks.push(e.data); };
    rec.onstop = () => {
      const blob = new Blob(chunks, { type: 'video/webm' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob); a.download = 'yamayuki-intro.webm';
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(a.href), 4000);
      dlBtn.disabled = false; dlBtn.textContent = label;
    };
    play(); score(); rec.start();
    setTimeout(() => rec.stop(), (END + .3) * 1000);
  });
})();
</script>
</body>
</html>
