      float d2=clamp(dot(n,fill),0.0,1.0);
      float diff=d1 + 0.22*d2;
      vec3 V=vec3(0.0,0.0,1.0); vec3 R=reflect(-key,n);
      float spec=pow(clamp(dot(R,V),0.0,1.0),64.0)*1.35;   // glossy wet highlight
      float rim=pow(1.0-clamp(n.z,0.0,1.0),2.6);
      float ao=0.62+0.38*clamp(n.z,0.0,1.0);               // crevices/edges deepen
      vec3 base=texture2D(uColor,vUV).rgb*vec3(0.62,0.74,0.86);
      vec2 suv=(gl_FragCoord.xy-0.5*uRes)/uRes.y;
      float ca=caustic(suv*2.2+vec2(0.0,uT*0.08));
      vec3 col=base*(0.28+0.90*diff)*ao + vec3(0.9,0.96,1.0)*spec + vec3(0.2,0.5,0.85)*rim*0.6;
      col+=vec3(0.25,0.55,0.8)*ca*d1*0.42;
      col=mix(col, vec3(0.10,0.30,0.44), (1.0-uNear)*0.36);
      gl_FragColor=vec4(col, a*uFade); }`;

  function mkProg(vs,fs){ const c=(t,s)=>{const o=gl.createShader(t);gl.shaderSource(o,s);gl.compileShader(o);
    if(!gl.getShaderParameter(o,gl.COMPILE_STATUS))console.error(gl.getShaderInfoLog(o));return o;};
    const p=gl.createProgram(); gl.attachShader(p,c(gl.VERTEX_SHADER,vs)); gl.attachShader(p,c(gl.FRAGMENT_SHADER,fs));
    gl.linkProgram(p); if(!gl.getProgramParameter(p,gl.LINK_STATUS))console.error(gl.getProgramInfoLog(p)); return p; }

  const bgP=mkProg(bgVS,bgFS);
  const triBuf=gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER,triBuf);
  gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,3,-1,-1,3]),gl.STATIC_DRAW);
  const bg_p=gl.getAttribLocation(bgP,'p');
  const bg_uRes=gl.getUniformLocation(bgP,'uRes'), bg_uT=gl.getUniformLocation(bgP,'uT');

  const fishP=mkProg(fishVS,fishFS);
  // grid mesh
  const GX=56, GY=12; const uvs=[];
  for(let y=0;y<GY;y++) for(let x=0;x<GX;x++){
    const u0=x/GX,u1=(x+1)/GX,v0=y/GY,v1=(y+1)/GY;
    uvs.push(u0,v0, u1,v0, u1,v1, u0,v0, u1,v1, u0,v1);
  }
  const meshBuf=gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER,meshBuf);
  gl.bufferData(gl.ARRAY_BUFFER,new Float32Array(uvs),gl.STATIC_DRAW);
  const MESHN=uvs.length/2;
  const f_aUV=gl.getAttribLocation(fishP,'aUV');
  const f_u={}; ['uT','uYaw','uCamD','uCenter','uSize','uColor','uAlpha','uNormal','uRes','uNear','uFade']
    .forEach(n=>f_u[n]=gl.getUniformLocation(fishP,n));

  // textures
  function mkTex(unit){ const t=gl.createTexture(); gl.activeTexture(gl.TEXTURE0+unit); gl.bindTexture(gl.TEXTURE_2D,t);
    gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_S,gl.CLAMP_TO_EDGE);
    gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_T,gl.CLAMP_TO_EDGE);
    gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MAG_FILTER,gl.LINEAR); return t; }
  const texColor=mkTex(0), texAlpha=mkTex(1), texNormal=mkTex(2);
  let texReady=false;
  const imgC=new Image(), imgA=new Image(), imgN=new Image();
  imgC.src=document.getElementById('t_rgb').textContent.trim();
  imgA.src=document.getElementById('t_alpha').textContent.trim();
  imgN.src=document.getElementById('t_normal').textContent.trim();
  function tryTex(){
    if(texReady) return true;
    if(!(imgC.complete&&imgC.width&&imgA.complete&&imgA.width&&imgN.complete&&imgN.width)) return false;
    gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL,false);
    gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D,texColor); gl.texImage2D(gl.TEXTURE_2D,0,gl.RGB,gl.RGB,gl.UNSIGNED_BYTE,imgC);
    gl.activeTexture(gl.TEXTURE1); gl.bindTexture(gl.TEXTURE_2D,texAlpha); gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,gl.RGBA,gl.UNSIGNED_BYTE,imgA);
    gl.activeTexture(gl.TEXTURE2); gl.bindTexture(gl.TEXTURE_2D,texNormal); gl.texImage2D(gl.TEXTURE_2D,0,gl.RGB,gl.RGB,gl.UNSIGNED_BYTE,imgN);
    texReady=true; return true;
  }

  gl.viewport(0,0,W,H);
  function renderBg(t){ gl.useProgram(bgP); gl.disable(gl.BLEND);
    gl.bindBuffer(gl.ARRAY_BUFFER,triBuf); gl.enableVertexAttribArray(bg_p); gl.vertexAttribPointer(bg_p,2,gl.FLOAT,false,0,0);
    gl.uniform2f(bg_uRes,W,H); gl.uniform1f(bg_uT,t); gl.drawArrays(gl.TRIANGLES,0,3); }

  const clamp01=x=>x<0?0:x>1?1:x;
  const seg=(t,s,d)=>clamp01((t-s)/d);
  const eo3=x=>1-Math.pow(1-x,3), ei3=x=>x*x*x;
  const smooth=(a,b,x)=>{x=clamp01((x-a)/(b-a));return x*x*(3-2*x);};

  function renderFish(t){
    if(!tryTex()) return;
    const prog=clamp01((t-0.2)/8.8);
    const near=smooth(0,1,prog);
    const dw=W*(0.34+0.40*near), dh=dw*TH/TW;
    const cx=W*1.16+(W*(-0.16)-W*1.16)*prog;
    const cy=H*0.55-Math.sin(prog*Math.PI)*H*0.12+Math.sin(t*0.8)*10*near;
    const yaw=0.85*Math.cos(prog*Math.PI);
    const fade=clamp01(Math.min(smooth(W+dw*0.6,W+dw*0.05,cx),smooth(-dw*0.6,-dw*0.05,cx)));
    if(fade<=0) return;
    gl.useProgram(fishP);
    gl.enable(gl.BLEND); gl.blendFunc(gl.SRC_ALPHA,gl.ONE_MINUS_SRC_ALPHA);
    gl.bindBuffer(gl.ARRAY_BUFFER,meshBuf); gl.enableVertexAttribArray(f_aUV); gl.vertexAttribPointer(f_aUV,2,gl.FLOAT,false,0,0);
    gl.uniform1i(f_u.uColor,0); gl.uniform1i(f_u.uAlpha,1); gl.uniform1i(f_u.uNormal,2);
    gl.uniform1f(f_u.uT,t); gl.uniform1f(f_u.uYaw,yaw); gl.uniform1f(f_u.uCamD,2.6);
    gl.uniform2f(f_u.uCenter, cx/W*2-1, -(cy/H*2-1));
    gl.uniform2f(f_u.uSize, dw/W*2, dh/H*2);
    gl.uniform2f(f_u.uRes,W,H); gl.uniform1f(f_u.uNear,near); gl.uniform1f(f_u.uFade,fade);
    gl.drawArrays(gl.TRIANGLES,0,MESHN);
    gl.disable(gl.BLEND);
  }

  // ---------- 2D overlays ----------
  const logo=new Image(); logo.src=document.getElementById('logo').textContent.trim();
  const snow=Array.from({length:70},()=>({x:Math.random()*W,y:Math.random()*H,r:Math.random()*2+0.5,
    vx:-(Math.random()*8+2),vy:(Math.random()*10+4),a:Math.random()*6.28,tw:Math.random()*2+.5}));
  let lastT=0;
  function marineSnow(t){ const dt=Math.min(Math.max(t-lastT,0),0.05); lastT=t;
    ctx.save(); ctx.globalCompositeOperation='lighter';
    for(const s of snow){ s.x+=s.vx*dt; s.y+=s.vy*dt; s.a+=s.tw*dt;
      if(s.y>H+6){s.y=-6;s.x=Math.random()*W;} if(s.x<-6){s.x=W+6;}
      const g=.22+.32*(Math.sin(s.a)*.5+.5);
      const rg=ctx.createRadialGradient(s.x,s.y,0,s.x,s.y,s.r*4);
      rg.addColorStop(0,`rgba(200,230,255,${g.toFixed(3)})`); rg.addColorStop(1,'rgba(140,200,255,0)');
      ctx.fillStyle=rg; ctx.beginPath(); ctx.arc(s.x,s.y,s.r*4,0,7); ctx.fill(); }
    ctx.restore();
  }
  function tracked(text,cx,cy,size,spacing,color,alpha){
    ctx.font=`500 ${size}px "Helvetica Neue",Arial,sans-serif`; ctx.textBaseline='middle'; ctx.textAlign='left'; ctx.globalAlpha=alpha;
    const ch=[...text],w=ch.map(c=>ctx.measureText(c).width); const total=w.reduce((a,b)=>a+b,0)+spacing*(ch.length-1);
    let x=cx-total/2; ctx.fillStyle=color; ch.forEach((c,i)=>{ctx.fillText(c,x,cy);x+=w[i]+spacing;}); ctx.globalAlpha=1;
  }
  const LOGO_Y=H*0.44;
  function logoDims(){ const lw=W*0.44; return {lw, lh:lw*logo.height/logo.width}; }
  function overlay(t){
    const p=eo3(seg(t,1.1,1.3));
    if(p>0&&logo.complete&&logo.width){ const {lw,lh}=logoDims(); const sc=1.05-0.05*p,dw=lw*sc,dh=lh*sc;
      ctx.save(); ctx.globalAlpha=p; ctx.shadowColor='rgba(120,200,255,0.5)'; ctx.shadowBlur=46;
      ctx.drawImage(logo,W/2-dw/2,LOGO_Y-dh/2,dw,dh); ctx.restore(); }
    const gp=eo3(seg(t,2.3,0.9));
    if(gp>0&&logo.width){ const {lh}=logoDims(); const full=W*0.44*0.30,y=LOGO_Y+lh/2+26;
      ctx.strokeStyle='#46b446'; ctx.lineWidth=3; ctx.globalAlpha=0.95;
      ctx.beginPath(); ctx.moveTo(W/2-full/2*gp,y); ctx.lineTo(W/2+full/2*gp,y); ctx.stroke(); ctx.globalAlpha=1; }
    const tp=eo3(seg(t,2.8,1.0));
    if(tp>0&&logo.width){ const {lh}=logoDims(); const y=LOGO_Y+lh/2+74;
      tracked('T O Y O S U   F I S H   M A R K E T',W/2,y,26,3,'#cfe6fa',tp*0.95); }
    const pw=eo3(seg(t,0.4,8.0))*W;
    const g=ctx.createLinearGradient(0,0,W,0); g.addColorStop(0,'#0064aa'); g.addColorStop(.7,'#2e9fd6'); g.addColorStop(1,'#46b446');
    ctx.fillStyle=g; ctx.fillRect(0,H-6,pw,6);
    const fa=ei3(seg(t,8.4,1.1)); if(fa>0){ ctx.fillStyle=`rgba(0,0,0,${fa})`; ctx.fillRect(0,0,W,H); }
  }

  function frame(t){
    renderBg(t); renderFish(t);
    ctx.clearRect(0,0,W,H); ctx.drawImage(gl_c,0,0,W,H);
    marineSnow(t); overlay(t);
  }

  let startMs=performance.now(), playing=true, holdT=0;
  function loop(now){ let t=playing?(now-startMs)/1000:holdT; if(t>=END){t=END;playing=false;holdT=END;} frame(t); requestAnimationFrame(loop); }
  requestAnimationFrame(loop);
  function play(){ startMs=performance.now(); playing=true; lastT=0; }
  window.__seek=(v)=>{ playing=false; holdT=v; lastT=v-0.016; };

  // ---------- audio ----------
  let ac=null,dest=null,master=null;
  function ensureAudio(){ if(ac) return;
    ac=new (window.AudioContext||window.webkitAudioContext)(); master=ac.createGain(); master.gain.value=.85;
    const comp=ac.createDynamicsCompressor(); master.connect(comp); comp.connect(ac.destination);
    dest=ac.createMediaStreamDestination(); comp.connect(dest); }
  function noise(d){ const b=ac.createBuffer(1,ac.sampleRate*d,ac.sampleRate); const a=b.getChannelData(0);
    for(let i=0;i<a.length;i++)a[i]=Math.random()*2-1; return b; }
  function ocean(at){ const n=ac.createBufferSource(); n.buffer=noise(10); n.loop=true;
    const lp=ac.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=420;
    const g=ac.createGain(); g.gain.setValueAtTime(.0001,at); g.gain.linearRampToValueAtTime(.10,at+1.5); g.gain.setValueAtTime(.10,at+7.0); g.gain.exponentialRampToValueAtTime(.0001,at+9.3);
    const lfo=ac.createOscillator(),lg=ac.createGain(); lfo.frequency.value=.15; lg.gain.value=.04; lfo.connect(lg); lg.connect(g.gain); lfo.start(at); lfo.stop(at+9.5);
    n.connect(lp); lp.connect(g); g.connect(master); n.start(at); n.stop(at+9.5);
    const o=ac.createOscillator(),og=ac.createGain(); o.type='sine'; o.frequency.value=48;
    og.gain.setValueAtTime(.0001,at); og.gain.linearRampToValueAtTime(.14,at+1.5); og.gain.setValueAtTime(.14,at+7.0); og.gain.exponentialRampToValueAtTime(.0001,at+9.3);
    o.connect(og); og.connect(master); o.start(at); o.stop(at+9.5); }
  function swell(at){ const o=ac.createOscillator(),g=ac.createGain(); o.type='triangle';
    o.frequency.setValueAtTime(120,at); o.frequency.exponentialRampToValueAtTime(55,at+.7);
    g.gain.setValueAtTime(.0001,at); g.gain.exponentialRampToValueAtTime(.8,at+.02); g.gain.exponentialRampToValueAtTime(.0001,at+1.3);
    o.connect(g); g.connect(master); o.start(at); o.stop(at+1.4); }
  function shimmer(at){ const n=ac.createBufferSource(); n.buffer=noise(1.4);
    const bp=ac.createBiquadFilter(); bp.type='bandpass'; bp.Q.value=1.2; bp.frequency.setValueAtTime(600,at); bp.frequency.exponentialRampToValueAtTime(5000,at+1.1);
    const g=ac.createGain(); g.gain.setValueAtTime(.0001,at); g.gain.linearRampToValueAtTime(.12,at+.3); g.gain.exponentialRampToValueAtTime(.0001,at+1.3);
    n.connect(bp); bp.connect(g); g.connect(master); n.start(at); n.stop(at+1.4); }
  function whoosh(at){ const n=ac.createBufferSource(); n.buffer=noise(0.9);
    const bp=ac.createBiquadFilter(); bp.type='bandpass'; bp.Q.value=.7; bp.frequency.setValueAtTime(300,at); bp.frequency.exponentialRampToValueAtTime(1400,at+.5);
    const g=ac.createGain(); g.gain.setValueAtTime(.0001,at); g.gain.linearRampToValueAtTime(.18,at+.2); g.gain.exponentialRampToValueAtTime(.0001,at+.7);
    n.connect(bp); bp.connect(g); g.connect(master); n.start(at); n.stop(at+.9); }
  function score(){ if(!ac) return; const t0=ac.currentTime+0.05; ocean(t0); swell(t0+1.1); shimmer(t0+1.2); whoosh(t0+4.0); }

  document.getElementById('replay').addEventListener('click',async()=>{ ensureAudio(); if(ac.state==='suspended')await ac.resume(); play(); score(); });
  const dl=document.getElementById('download');
  dl.addEventListener('click',async()=>{
    ensureAudio(); if(ac.state==='suspended')await ac.resume();
    const mimes=['video/webm;codecs=vp9,opus','video/webm;codecs=vp8,opus','video/webm'];
    const mime=mimes.find(m=>window.MediaRecorder&&MediaRecorder.isTypeSupported(m));
    if(!mime){ alert('このブラウザは録画に未対応です。画面録画をご利用ください。'); return; }
    dl.disabled=true; const lb=dl.textContent; dl.textContent='● 録画中…';
    const vs=view.captureStream(30); const stream=new MediaStream([...vs.getVideoTracks(),...dest.stream.getAudioTracks()]);
    const chunks=[]; const rec=new MediaRecorder(stream,{mimeType:mime,videoBitsPerSecond:14e6});
    rec.ondataavailable=e=>{ if(e.data.size) chunks.push(e.data); };
    rec.onstop=()=>{ const blob=new Blob(chunks,{type:'video/webm'});
      const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='yamayuki-intro.webm';
      document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(a.href),4000);
      dl.disabled=false; dl.textContent=lb; };
    play(); score(); rec.start(); setTimeout(()=>rec.stop(),(END+0.3)*1000);
  });
})();
</script>
</body>
</html>
