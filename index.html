<script>
(() => {
  const W = 1920, H = 1080, END = 9.5;
  const view = document.getElementById('view');
  const ctx = view.getContext('2d');

  // ── WebGL underwater background (caustics + god rays) ──
  const gl_c = document.createElement('canvas'); gl_c.width = W; gl_c.height = H;
  const gl = gl_c.getContext('webgl', { antialias:true, preserveDrawingBuffer:true });
  const VS = `attribute vec2 p; void main(){ gl_Position=vec4(p,0.0,1.0); }`;
  const FS = `
  precision highp float; uniform vec2 uRes; uniform float uT;
  float caustic(vec2 uv){
    vec2 p = mod(uv*6.28318, 6.28318) - 250.0;
    vec2 i = vec2(p); float c=1.0, inten=0.0045;
    for(int n=0;n<5;n++){
      float t = uT*0.35*(1.0-(3.5/float(n+1)));
      i = p + vec2(cos(t-i.x)+sin(t+i.y), sin(t-i.y)+cos(t+i.x));
      c += 1.0/length(vec2(p.x/(sin(i.x+t)/inten), p.y/(cos(i.y+t)/inten)));
    }
    c/=5.0; c=1.17-pow(c,1.4); return clamp(pow(abs(c),8.0),0.0,1.0);
  }
  void main(){
    vec2 uv=(gl_FragCoord.xy-0.5*uRes)/uRes.y;
    float h=smoothstep(-0.55,0.85, uv.y*0.9+0.25);
    vec3 deep=vec3(0.010,0.052,0.105), mid=vec3(0.02,0.185,0.33), hi=vec3(0.07,0.44,0.63);
    vec3 col=mix(deep, mix(mid,hi,h), h);
    float ra=uv.x/(uv.y+1.7);
    float rays=(0.5+0.5*sin(ra*42.0+uT*0.30))*(0.4+0.6*sin(ra*18.0-uT*0.19));
    rays=pow(max(rays,0.0),2.6)*smoothstep(-0.2,0.8, uv.y+0.5);
    col+=vec3(0.14,0.36,0.52)*rays*0.5;
    float ca=caustic(vec2(uv.x*2.0, uv.y*2.0 - uT*0.05));
    col+=vec3(0.18,0.46,0.68)*ca*0.5*smoothstep(-0.4,0.9, uv.y+0.4);
    col=pow(col,vec3(0.92));
    float vig=smoothstep(1.45,0.35,length(uv)); col*=mix(0.6,1.0,vig);
    gl_FragColor=vec4(col,1.0);
  }`;
  function sh(t,s){ const o=gl.createShader(t); gl.shaderSource(o,s); gl.compileShader(o);
    if(!gl.getShaderParameter(o,gl.COMPILE_STATUS)) console.error(gl.getShaderInfoLog(o)); return o; }
  const prog=gl.createProgram(); gl.attachShader(prog,sh(gl.VERTEX_SHADER,VS)); gl.attachShader(prog,sh(gl.FRAGMENT_SHADER,FS));
  gl.linkProgram(prog); gl.useProgram(prog);
  const buf=gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER,buf);
  gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,3,-1,-1,3]),gl.STATIC_DRAW);
  const loc=gl.getAttribLocation(prog,'p'); gl.enableVertexAttribArray(loc); gl.vertexAttribPointer(loc,2,gl.FLOAT,false,0,0);
  const uRes=gl.getUniformLocation(prog,'uRes'), uT=gl.getUniformLocation(prog,'uT'); gl.viewport(0,0,W,H);
  function renderGL(t){ gl.uniform2f(uRes,W,H); gl.uniform1f(uT,t); gl.drawArrays(gl.TRIANGLES,0,3); }

  // ── assets ──
  const logo=new Image(); logo.src=document.getElementById('logo').textContent.trim();
  const tRGB=new Image(); tRGB.src=document.getElementById('tuna_rgb').textContent.trim();
  const tA=new Image();   tA.src=document.getElementById('tuna_alpha').textContent.trim();

  // build graded tuna (photo -> masked -> underwater color grade), once
  let tuna=null, tunaW=0, tunaH=0;
  function buildTuna(){
    if(tuna) return true;
    if(!(tRGB.complete&&tRGB.width&&tA.complete&&tA.width)) return false;
    const w=tRGB.width, h=tRGB.height;
    const c=document.createElement('canvas'); c.width=w; c.height=h; const x=c.getContext('2d');
    x.drawImage(tRGB,0,0);
    x.globalCompositeOperation='destination-in'; x.drawImage(tA,0,0,w,h);           // apply alpha
    x.globalCompositeOperation='multiply'; x.fillStyle='rgb(150,176,205)'; x.fillRect(0,0,w,h); // cool grade
    x.globalCompositeOperation='destination-in'; x.drawImage(tA,0,0,w,h);           // restore alpha
    x.globalCompositeOperation='source-over';
    tuna=c; tunaW=w; tunaH=h; return true;
  }

  // marine snow
  const snow=Array.from({length:70},()=>({x:Math.random()*W,y:Math.random()*H,r:Math.random()*2+0.5,
    vx:-(Math.random()*8+2),vy:(Math.random()*10+4),a:Math.random()*6.28,tw:Math.random()*2+.5}));

  const clamp01=x=>x<0?0:x>1?1:x;
  const seg=(t,s,d)=>clamp01((t-s)/d);
  const eo3=x=>1-Math.pow(1-x,3);
  const ei3=x=>x*x*x;
  const smooth=(a,b,x)=>{ x=clamp01((x-a)/(b-a)); return x*x*(3-2*x); };

  const fbuf=document.createElement('canvas'); const fbx=fbuf.getContext('2d');
  let lastT=0;
  function marineSnow(t){
    const dt=Math.min(Math.max(t-lastT,0),0.05); lastT=t;
    ctx.save(); ctx.globalCompositeOperation='lighter';
    for(const s of snow){ s.x+=s.vx*dt; s.y+=s.vy*dt; s.a+=s.tw*dt;
      if(s.y>H+6){s.y=-6;s.x=Math.random()*W;} if(s.x<-6){s.x=W+6;}
      const g=.22+.32*(Math.sin(s.a)*.5+.5);
      const rg=ctx.createRadialGradient(s.x,s.y,0,s.x,s.y,s.r*4);
      rg.addColorStop(0,`rgba(200,230,255,${g.toFixed(3)})`); rg.addColorStop(1,'rgba(140,200,255,0)');
      ctx.fillStyle=rg; ctx.beginPath(); ctx.arc(s.x,s.y,s.r*4,0,7); ctx.fill(); }
    ctx.restore();
  }

  function drawTuna(t){
    if(!buildTuna()) return;
    const prog=clamp01((t-0.2)/8.6);
    const dw=W*0.54, dh=dw*tunaH/tunaW;
    const cx=W*1.18 + (W*(-0.18)-W*1.18)*prog;         // glide right -> left
    const cy=H*0.52 + Math.sin(t*0.8)*12;               // gentle bob
    const a=Math.min(smooth(-dw*0.55,-dw*0.15,cx-W), 1) * smooth(-0.1,0.12,prog) * (1-smooth(0.9,1.0,prog));
    const alpha=clamp01(Math.min(smooth(W+dw*0.6, W+dw*0.1, cx), smooth(-dw*0.6,-dw*0.1, cx)) );

    const padX=30, padY=44;
    const bw=Math.ceil(dw)+padX*2, bh=Math.ceil(dh)+padY*2;
    if(fbuf.width!==bw||fbuf.height!==bh){ fbuf.width=bw; fbuf.height=bh; }
    fbx.clearRect(0,0,bw,bh);
    // swim undulation: vertical strips, amplitude grows toward tail (right)
    const strips=56, ssrc=tunaW/strips, sdst=dw/strips;
    for(let i=0;i<strips;i++){
      const sx=i/strips;                                // 0 head(left) .. 1 tail(right)
      const amp=13*smooth(0.15,1.0,sx);
      const dy=amp*Math.sin(sx*5.5 - t*4.6);
      fbx.drawImage(tuna, i*ssrc,0,ssrc,tunaH, padX+i*sdst, padY+dy, sdst+1, dh);
    }
    // light playing on the body (clipped to fish via source-atop)
    fbx.globalCompositeOperation='source-atop';
    for(let k=0;k<3;k++){
      const hx=padX + ((t*70 + k*430) % (dw+300)) - 150;
      const hy=padY + dh*(0.22+0.24*k);
      const g=fbx.createRadialGradient(hx,hy,0,hx,hy,190);
      g.addColorStop(0,'rgba(190,225,255,0.15)'); g.addColorStop(1,'rgba(190,225,255,0)');
      fbx.fillStyle=g; fbx.fillRect(0,0,bw,bh);
    }
    const rg=fbx.createLinearGradient(0,padY,0,padY+dh*0.42);
    rg.addColorStop(0,'rgba(150,200,255,0.13)'); rg.addColorStop(1,'rgba(150,200,255,0)');
    fbx.fillStyle=rg; fbx.fillRect(0,0,bw,bh);
    fbx.globalCompositeOperation='source-over';

    ctx.save(); ctx.globalAlpha=alpha;
    ctx.shadowColor='rgba(0,15,30,0.5)'; ctx.shadowBlur=40; ctx.shadowOffsetY=10;
    ctx.drawImage(fbuf, cx-dw/2-padX, cy-dh/2-padY);
    ctx.restore();
  }

  function tracked(text, cx, cy, size, spacing, color, alpha){
    ctx.font=`500 ${size}px "Helvetica Neue",Arial,sans-serif`;
    ctx.textBaseline='middle'; ctx.textAlign='left'; ctx.globalAlpha=alpha;
    const ch=[...text], w=ch.map(c=>ctx.measureText(c).width);
    const total=w.reduce((a,b)=>a+b,0)+spacing*(ch.length-1);
    let x=cx-total/2; ctx.fillStyle=color;
    ch.forEach((c,i)=>{ ctx.fillText(c,x,cy); x+=w[i]+spacing; }); ctx.globalAlpha=1;
  }

  const LOGO_Y=H*0.44;
  function logoDims(){ const lw=W*0.44; return {lw, lh:lw*logo.height/logo.width}; }
  function overlay(t){
    const p=eo3(seg(t,1.1,1.3));
    if(p>0 && logo.complete && logo.width){
      const {lw,lh}=logoDims(); const sc=1.05-0.05*p, dw=lw*sc, dh=lh*sc;
      ctx.save(); ctx.globalAlpha=p; ctx.shadowColor='rgba(120,200,255,0.5)'; ctx.shadowBlur=46;
      ctx.drawImage(logo, W/2-dw/2, LOGO_Y-dh/2, dw, dh); ctx.restore();
    }
    const gp=eo3(seg(t,2.3,0.9));
    if(gp>0 && logo.width){ const {lh}=logoDims(); const full=W*0.44*0.30, y=LOGO_Y+lh/2+26;
      ctx.strokeStyle='#46b446'; ctx.lineWidth=3; ctx.globalAlpha=0.95;
      ctx.beginPath(); ctx.moveTo(W/2-full/2*gp,y); ctx.lineTo(W/2+full/2*gp,y); ctx.stroke(); ctx.globalAlpha=1; }
    const tp=eo3(seg(t,2.8,1.0));
    if(tp>0 && logo.width){ const {lh}=logoDims(); const y=LOGO_Y+lh/2+74;
      tracked('T O Y O S U   F I S H   M A R K E T', W/2, y, 26, 3, '#cfe6fa', tp*0.95); }
    const pw=eo3(seg(t,0.4,8.0))*W;
    const g=ctx.createLinearGradient(0,0,W,0);
    g.addColorStop(0,'#0064aa'); g.addColorStop(.7,'#2e9fd6'); g.addColorStop(1,'#46b446');
    ctx.fillStyle=g; ctx.fillRect(0,H-6,pw,6);
    const fa=ei3(seg(t,8.4,1.1));
    if(fa>0){ ctx.fillStyle=`rgba(0,0,0,${fa})`; ctx.fillRect(0,0,W,H); }
  }

  function frame(t){
    renderGL(t);
    ctx.clearRect(0,0,W,H);
    ctx.drawImage(gl_c,0,0,W,H);
    marineSnow(t);
    drawTuna(t);
    overlay(t);
  }

  let startMs=performance.now(), playing=true, holdT=0;
  function loop(now){ let t=playing?(now-startMs)/1000:holdT;
    if(t>=END){ t=END; playing=false; holdT=END; } frame(t); requestAnimationFrame(loop); }
  requestAnimationFrame(loop);
  function play(){ startMs=performance.now(); playing=true; lastT=0; }
  window.__seek=(v)=>{ playing=false; holdT=v; lastT=v-0.016; };

  // ── audio ──
  let ac=null,dest=null,master=null;
  function ensureAudio(){ if(ac) return;
    ac=new (window.AudioContext||window.webkitAudioContext)();
    master=ac.createGain(); master.gain.value=.85;
    const comp=ac.createDynamicsCompressor(); master.connect(comp); comp.connect(ac.destination);
    dest=ac.createMediaStreamDestination(); comp.connect(dest); }
  function noise(d){ const b=ac.createBuffer(1,ac.sampleRate*d,ac.sampleRate); const a=b.getChannelData(0);
    for(let i=0;i<a.length;i++)a[i]=Math.random()*2-1; return b; }
  function ocean(at){ const n=ac.createBufferSource(); n.buffer=noise(10); n.loop=true;
    const lp=ac.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=420;
    const g=ac.createGain(); g.gain.setValueAtTime(.0001,at); g.gain.linearRampToValueAtTime(.10,at+1.5);
    g.gain.setValueAtTime(.10,at+7.0); g.gain.exponentialRampToValueAtTime(.0001,at+9.3);
    const lfo=ac.createOscillator(),lg=ac.createGain(); lfo.frequency.value=.15; lg.gain.value=.04;
    lfo.connect(lg); lg.connect(g.gain); lfo.start(at); lfo.stop(at+9.5);
    n.connect(lp); lp.connect(g); g.connect(master); n.start(at); n.stop(at+9.5);
    const o=ac.createOscillator(),og=ac.createGain(); o.type='sine'; o.frequency.value=48;
    og.gain.setValueAtTime(.0001,at); og.gain.linearRampToValueAtTime(.14,at+1.5);
    og.gain.setValueAtTime(.14,at+7.0); og.gain.exponentialRampToValueAtTime(.0001,at+9.3);
    o.connect(og); og.connect(master); o.start(at); o.stop(at+9.5); }
  function swell(at){ const o=ac.createOscillator(),g=ac.createGain(); o.type='triangle';
    o.frequency.setValueAtTime(120,at); o.frequency.exponentialRampToValueAtTime(55,at+.7);
    g.gain.setValueAtTime(.0001,at); g.gain.exponentialRampToValueAtTime(.8,at+.02); g.gain.exponentialRampToValueAtTime(.0001,at+1.3);
    o.connect(g); g.connect(master); o.start(at); o.stop(at+1.4); }
  function shimmer(at){ const n=ac.createBufferSource(); n.buffer=noise(1.4);
    const bp=ac.createBiquadFilter(); bp.type='bandpass'; bp.Q.value=1.2;
    bp.frequency.setValueAtTime(600,at); bp.frequency.exponentialRampToValueAtTime(5000,at+1.1);
    const g=ac.createGain(); g.gain.setValueAtTime(.0001,at); g.gain.linearRampToValueAtTime(.12,at+.3); g.gain.exponentialRampToValueAtTime(.0001,at+1.3);
    n.connect(bp); bp.connect(g); g.connect(master); n.start(at); n.stop(at+1.4); }
  function whoosh(at){ const n=ac.createBufferSource(); n.buffer=noise(0.9);
    const bp=ac.createBiquadFilter(); bp.type='bandpass'; bp.Q.value=.7;
    bp.frequency.setValueAtTime(300,at); bp.frequency.exponentialRampToValueAtTime(1400,at+.5);
    const g=ac.createGain(); g.gain.setValueAtTime(.0001,at); g.gain.linearRampToValueAtTime(.18,at+.2); g.gain.exponentialRampToValueAtTime(.0001,at+.7);
    n.connect(bp); bp.connect(g); g.connect(master); n.start(at); n.stop(at+.9); }
  function score(){ if(!ac) return; const t0=ac.currentTime+0.05;
    ocean(t0); swell(t0+1.1); shimmer(t0+1.2); whoosh(t0+4.0); }

  document.getElementById('replay').addEventListener('click', async()=>{
    ensureAudio(); if(ac.state==='suspended') await ac.resume(); play(); score(); });
  const dl=document.getElementById('download');
  dl.addEventListener('click', async()=>{
    ensureAudio(); if(ac.state==='suspended') await ac.resume();
    const mimes=['video/webm;codecs=vp9,opus','video/webm;codecs=vp8,opus','video/webm'];
    const mime=mimes.find(m=>window.MediaRecorder&&MediaRecorder.isTypeSupported(m));
    if(!mime){ alert('このブラウザは録画に未対応です。画面録画をご利用ください。'); return; }
    dl.disabled=true; const lb=dl.textContent; dl.textContent='● 録画中…';
    const vs=view.captureStream(30);
    const stream=new MediaStream([...vs.getVideoTracks(), ...dest.stream.getAudioTracks()]);
    const chunks=[]; const rec=new MediaRecorder(stream,{mimeType:mime,videoBitsPerSecond:14e6});
    rec.ondataavailable=e=>{ if(e.data.size) chunks.push(e.data); };
    rec.onstop=()=>{ const blob=new Blob(chunks,{type:'video/webm'});
      const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='yamayuki-intro.webm';
      document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(a.href),4000);
      dl.disabled=false; dl.textContent=lb; };
    play(); score(); rec.start();
    setTimeout(()=>rec.stop(), (END+0.3)*1000);
  });
})();
</script>
